<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="{{ locale.navigation_label }}">
        <button type="button" aria-label="{{ locale.menu_label }}"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="{{ locale.home | relative_url }}" target="_self">{{ locale.name }}<span class="nav-dot">.</span></a></li>
          {% assign navigation = site.data.navigation[language] | default: site.data.navigation.main %}
          {% for link in navigation %}
            <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}" target="_self">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <nav class="language-switch" aria-label="{{ locale.language_label }}"{% if page.homepage %} data-homepage{% endif %}>
        <a href="{{ '/zh/' | relative_url }}{% if page.research_article %}#publications{% endif %}" data-home="{{ '/zh/' | relative_url }}" target="_self" lang="zh-CN" hreflang="zh-CN"{% if page.research_article %} aria-label="中文首页"{% endif %}{% if language == 'zh-CN' and page.homepage %} aria-current="page"{% endif %}>中文</a>
        <span aria-hidden="true">|</span>
        <a href="{{ '/' | relative_url }}{% if page.research_article %}#publications{% endif %}" data-home="{{ '/' | relative_url }}" target="_self" lang="en" hreflang="en"{% if page.research_article %} aria-label="English homepage"{% endif %}{% if language == 'en' and page.homepage %} aria-current="page"{% endif %}>EN</a>
      </nav>
    </div>
  </div>
</div>
